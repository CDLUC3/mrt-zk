services:
  zoo:
    container_name: zoo
    image: public.ecr.aws/docker/library/zookeeper:3.9.5
    ports:
    - published: 8084
      target: 2181
    - published: 8080
      target: 8080
    restart: unless-stopped
    stdin_open: true
    tty: true

